<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-app">
        <h1>Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
            >
            <button id="search-btn">Search</button>
        </div>

        <p id="message">Enter a city to check its weather.</p>

        <div id="weather-card" class="weather-card" hidden>
            <h2 id="city-name"></h2>
            <div id="weather-icon" class="weather-icon"></div>
            <h3 id="temperature"></h3>
            <p id="condition"></p>

            <div class="weather-details">
                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity"></strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind"></strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feels-like"></strong>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
